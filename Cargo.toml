[workspace]
members = [
    "crates/ttagy-core",
    "crates/ttagy-client",
    "crates/ttagyd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer"]
license = "BSD-3-Clause OR Apache-2.0"
repository = "https://github.com/wittkung/ttagy"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
